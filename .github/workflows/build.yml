name: Build Lupus Workflow Images

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_docker:
    name: Build and push Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build_singularity:
    name: Build and push Singularity image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Singularity
        uses: eWaterCycle/setup-singularity@v7
        with:
          singularity-version: 3.8.7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Singularity image
        run: |
          singularity build lupus-workflow.sif lupus-workflow.def

      - name: Login and push to GHCR (OCI format)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get repository name in lowercase
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          # Generate tag
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG="latest"
          else
            TAG="${{ github.ref_name }}"
          fi

          # Push using Singularity's OCI support
          echo "$GHCR_TOKEN" | singularity remote login -u ${{ github.actor }} --password-stdin oras://ghcr.io
          singularity push lupus-workflow.sif oras://ghcr.io/${REPO_LOWER}:${TAG}-singularity

      - name: Upload Singularity image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lupus-workflow-singularity
          path: lupus-workflow.sif
          retention-days: 30
